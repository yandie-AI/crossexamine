[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "menxia"
version = "0.1.0"
description = "Adversarial review for AI coding agents: other models read your agent's actual transcript -- not its self-report -- and can veto the commit."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Yandie Intelligent Technology (Beijing) Co., Ltd."}]
keywords = ["ai-agent", "code-review", "claude-code", "coding-agent", "governance",
            "adversarial-review", "guardrails", "pre-commit", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
menxia = "menxia.cli:main"

[project.urls]
Homepage = "https://github.com/yandie-AI/menxia"
Issues = "https://github.com/yandie-AI/menxia/issues"

[tool.hatch.build.targets.wheel]
packages = ["menxia"]

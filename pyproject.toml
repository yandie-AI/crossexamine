[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crossexamine"
version = "0.1.0"
description = "Cross-examine your AI coding agent: models from other vendors read its raw session transcript -- not its self-report -- and can veto the commit."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Yandie Intelligent Technology (Beijing) Co., Ltd."}]
keywords = ["ai-agent", "code-review", "claude-code", "coding-agent", "governance",
            "adversarial-review", "guardrails", "pre-commit", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
crossexamine = "crossexamine.cli:main"
cx = "crossexamine.cli:main"

[project.urls]
Homepage = "https://github.com/yandie-AI/crossexamine"
Issues = "https://github.com/yandie-AI/crossexamine/issues"

[tool.hatch.build.targets.wheel]
packages = ["crossexamine"]
